[project]
name = "sindre-project-template"
version = "0.1.0"
description = "最小、可测试、可发布的 Python 项目模板"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sindre-project = "project_template.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
