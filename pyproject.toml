[project]
name = "flask-inference-template"
version = "0.1.0"
description = "可测试的 Flask 文件推理服务模板"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0,<4.0",
  "flask-cors>=4.0,<6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
