[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sindre-gui"
version = "0.1.0"
description = "PyQt5 desktop application and plugin template."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SindreYang" }]
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "pyqtads>=3.8.1",
    "pluggy>=1.5",
    "qdarkstyle>=3.2",
]

[project.optional-dependencies]
vtk = ["vedo>=2024.5", "vtk>=9.3"]
network = ["httpx>=0.27", "requests>=2.32"]
lmdb = ["numpy>=1.26", "lmdb>=1.4"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sindre-gui = "sindre_gui.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sindre_gui"]
include = ["src/sindre_gui/ui/forms/*.ui", "src/sindre_gui/ui/generated/*.py", "src/sindre_gui/resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/sindre_gui/ui/generated"]
