[project]
name = "pytorch-hydra-template"
version = "0.1.0"
description = "可复用的 PyTorch、Hydra 和 Lightning Fabric 训练模板"
requires-python = ">=3.10"
dependencies = [
  "hydra-colorlog>=1.2",
  "hydra-core>=1.3",
  "hydra-optuna-sweeper>=1.2",
  "lightning>=2.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "tensorboard>=2.15",
  "torch>=2.1",
  "torchmetrics>=1.2",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
