version: 1
repository: SindreYang/SindreTemplate
templates:
  pytorch-hydra:
    branch: template/pytorch-hydra
    language: python
    purpose: PyTorch 与 Hydra 实验训练模板
    verify: uv sync && uv run pytest
  cmake:
    branch: template/cmake
    language: cpp
    purpose: 跨平台 CMake/C++ 项目模板
    verify: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
  flask:
    branch: template/flask
    language: python
    purpose: Flask 推理服务模板
    verify: uv sync && uv run pytest
  project:
    branch: template/project
    language: python
    purpose: 最小可发布 Python 项目模板
    verify: uv sync && uv run pytest
