version: 1
repository: SindreYang/SindreTemplate
templates:
  pytorch-hydra:
    branch: template/pytorch-hydra
    source: SindreYang/pytorch-hydra-template
    language: python
    purpose: PyTorch 与 Hydra 实验训练模板
    status: migrated
    verify: uv sync && uv run pytest
  cmake:
    branch: template/cmake
    source: SindreYang/cmake-template
    language: cpp
    purpose: 跨平台 CMake/C++ 项目模板
    status: migrated
    verify: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
  flask:
    branch: template/flask
    source: SindreYang/Flask-template
    language: python
    purpose: Flask 推理服务模板
    status: migrated
    verify: uv sync && uv run pytest
  project:
    branch: template/project
    source: SindreYang/ProjectTemplate
    language: python
    purpose: 最小可发布 Python 项目模板
    status: migrated
    verify: uv sync && uv run pytest
  pyqt:
    branch: template/pyqt
    source: SindreYang/SindreGui
    language: python
    purpose: PyQt5 桌面应用与插件系统模板
    status: migrated
    verify: uv sync --extra dev && uv run pytest && uv run sindre-gui
  sindrejs:
    branch: template/sindrejs
    source: SindreYang/SindreJS-official-site
    language: typescript
    purpose: SindreJS TypeScript/Bun 工具库与 Next.js 官网模板
    status: migrated
    verify: bun install --frozen-lockfile && bun run check && bun test && bun run build
